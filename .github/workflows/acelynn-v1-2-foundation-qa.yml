name: Acelynn Pro v1.3 Professional Metering QA

on:
  push:
    branches: [abl-acelynn-pro-recovery-v1-2-stage, hotfix-acelynn-v1-2-post-release, repair-acelynn-v1-2-production-shell, abl-acelynn-pro-v1-3-professional-metering]
    paths:
      - 'api/**'
      - 'js/**'
      - 'tests/**'
      - 'tools/reconcile-acelynn-main.py'
      - 'index.html'
      - 'app-base.html'
      - 'package.json'
      - 'vitest.config.js'
      - '.github/workflows/acelynn-v1-2-foundation-qa.yml'
      - 'vercel.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact staging branch
        uses: actions/checkout@v5

      - name: Verify deployment remains disabled
        run: grep -Eq '"deploymentEnabled"[[:space:]]*:[[:space:]]*false' vercel.json

      - name: Reconcile exact staged shell in working tree
        run: python3 tools/reconcile-acelynn-main.py

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install isolated QA dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax check v1.3 modules and served shell
        run: |
          node --check js/meta.js
          node --check js/db.js
          node --check js/storage.js
          node --check js/migration.js
          node --check js/spectral.js
          node --check js/insights.js
          node --check js/metering-core.js
          node --check js/metering-processor.js
          node --check js/metering-engine.js
          node --check js/metering-ui.js
          node --check js/runtime.js
          node --check js/ui-enhancements.js
          node --check api/shell-transform.cjs
          node --check api/demo-shell.js

      - name: Run v1.2 regression plus v1.3 professional metering QA
        run: npm run qa:v1.3

      - name: Confirm controlled v1.3 module wiring boundary
        run: |
          test "$(grep -o '<script type="module" src="/js/metering-engine.js"></script>' index.html | wc -l)" -eq 1
          test "$(grep -o '<script type="module" src="/js/metering-engine.js"></script>' app-base.html | wc -l)" -eq 1
          test "$(grep -o '<script type="module" src="/js/metering-ui.js"></script>' index.html | wc -l)" -eq 1
          test "$(grep -o '<script type="module" src="/js/metering-ui.js"></script>' app-base.html | wc -l)" -eq 1
          test "$(grep -o '<script type="module" src="/js/runtime.js"></script>' index.html | wc -l)" -eq 1
          test "$(grep -o '<script type="module" src="/js/runtime.js"></script>' app-base.html | wc -l)" -eq 1
          test "$(grep -o '<script type="module" src="/js/ui-enhancements.js"></script>' index.html | wc -l)" -eq 1
          test "$(grep -o '<script type="module" src="/js/ui-enhancements.js"></script>' app-base.html | wc -l)" -eq 1
          ! grep -q '/js/metering-processor.js' index.html
          ! grep -q '/js/metering-processor.js' app-base.html
          ! grep -q '/js/spectral.js' index.html
          ! grep -q '/js/spectral.js' app-base.html
          ! grep -q '/js/migration.js' index.html
          ! grep -q '/js/migration.js' app-base.html
          grep -q 'professionalMetering:globalThis.AcelynnMetering' index.html
          grep -q 'professionalMetering:globalThis.AcelynnMetering' app-base.html
          grep -q "sourceType:'microphone'" index.html
          grep -q "sourceType:'file'" index.html
          grep -q 'Save last check' index.html
          echo 'v1.3 professional metering is wired through AudioWorklet bridge while v1.2 runtime/recovery boundaries remain intact.'
