name: Acelynn Pro Runtime Recovery Browser QA

# Runs on isolated Phase 7 QA branches first, then re-validates the canonical recovery branch after squash integration.
on:
  push:
    branches: [phase7-runtime-recovery-qa, phase7-remove-service-worker, android-signing-cutover-data-recovery]
    paths:
      - 'acelynn-recovery.js'
      - 'index.html'
      - 'app-base.html'
      - 'sw.js'
      - 'tools/apply-signing-cutover-data-recovery.py'
      - 'tools/qa-signing-cutover-data-recovery.mjs'
      - 'tools/qa-recovery-browser.cjs'
      - '.github/workflows/runtime-recovery-browser-qa.yml'
      - 'vercel.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  browser-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact QA branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply deterministic recovery shell
        run: python3 tools/apply-signing-cutover-data-recovery.py
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Run recovery engine regression QA
        run: |
          node tools/qa-signing-cutover-data-recovery.mjs
          node --check acelynn-recovery.js
      - name: Install isolated Playwright test dependency
        run: |
          mkdir -p /tmp/acelynn-browser
          cd /tmp/acelynn-browser
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve exact staged Acelynn shell
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/acelynn-http.log 2>&1 &
          echo $! >/tmp/acelynn-http.pid
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/acelynn-http.log
          exit 1
      - name: Run real browser export restore merge round trip
        env:
          NODE_PATH: /tmp/acelynn-browser/node_modules
        run: node tools/qa-recovery-browser.cjs
      - name: Verify deployment and generated-source boundary
        run: |
          grep -Eq '"deploymentEnabled"[[:space:]]*:[[:space:]]*false' vercel.json
          test ! -d .vercel/output
          test ! -e sw.js
          unexpected="$(git diff --name-only | grep -Ev '^(index.html|app-base.html)$' || true)"
          test -z "$unexpected" || { echo "Unexpected working-tree changes: $unexpected" >&2; exit 1; }
          test ! -e legacy-sw-test.js
          echo 'No Vercel deployment, APK install, uninstall, or signing cutover executed.'
      - name: Commit deterministic recovery shell if needed
        shell: bash
        run: |
          git add index.html app-base.html
          if git diff --cached --quiet; then
            echo 'Generated Acelynn Pro runtime recovery shell already settled.'
            exit 0
          fi
          changed="$(git diff --cached --name-only | sort)"
          expected=$'app-base.html\nindex.html'
          test "$changed" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'recovery: retire Acelynn Pro legacy service worker'
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Stop local test server
        if: always()
        run: |
          test ! -f /tmp/acelynn-http.pid || kill "$(cat /tmp/acelynn-http.pid)" 2>/dev/null || true
